<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mono Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#fff;--s1:#fafafa;--s2:#f1f1f1;--bd:#e7e7e7;--bd2:#cfcfcf;--tx:#0a0a0a;--mut:#757575;--inv:#0a0a0a;--ivt:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--s1:#0b0b0b;--s2:#161616;--bd:#242424;--bd2:#3b3b3b;--tx:#f5f5f5;--mut:#8c8c8c;--inv:#fff;--ivt:#000}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--s1:#0b0b0b;--s2:#161616;--bd:#242424;--bd2:#3b3b3b;--tx:#f5f5f5;--mut:#8c8c8c;--inv:#fff;--ivt:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow:hidden}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
svg.lucide{width:15px;height:15px;stroke-width:1.75;flex:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.side{min-height:0;overflow-y:auto;scrollbar-width:none;border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:12px}.side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.02em}
.brand b{font-weight:700}.brand span{color:var(--mut);font-weight:500}
.logo{width:26px;height:26px;border-radius:7px;background:var(--inv);color:var(--ivt);display:grid;place-items:center}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.hero{display:grid;gap:4px}
.big{font-size:34px;font-weight:600;letter-spacing:-.045em;line-height:1}
.big small{font-size:15px;color:var(--mut);letter-spacing:-.01em;margin-left:3px;font-weight:500}
.sub{color:var(--mut);font-size:12px}
.cw{position:relative;width:112px;height:112px;margin:0 auto}
.cc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc b{font-size:22px;letter-spacing:-.04em;line-height:1}.cc span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.q{height:2px;background:var(--bd);border-radius:2px;overflow:hidden}.q div{height:100%;background:var(--inv)}
.lg{display:grid;gap:5px}
.lr{display:flex;align-items:center;gap:8px;font-size:12px}
.lr i{width:8px;height:8px;border-radius:2px;flex:none}
.lr em{margin-left:auto;font-style:normal;color:var(--mut)}
.nav{display:grid;gap:1px}
.nv{display:flex;align-items:center;gap:9px;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;color:var(--mut)}
.nv:hover{background:var(--s2);color:var(--tx)}
.nv.on{background:var(--inv);color:var(--ivt)}
.nv span{flex:1;font-weight:500}.nv em{font-style:normal;font-size:11px;opacity:.7}
.main{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;z-index:31;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sr{position:relative;flex:1;min-width:180px}
.sr svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.sr input{width:100%;height:32px;border:1px solid var(--bd);background:var(--s1);border-radius:7px;padding:0 34px 0 31px;outline:0}
.sr input:focus{border-color:var(--tx);background:var(--bg)}
kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:600 10px Inter,sans-serif;border:1px solid var(--bd2);border-radius:4px;padding:0 5px;color:var(--mut)}
.b{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:1px solid var(--bd);background:var(--bg);border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.b:hover{border-color:var(--tx)}
.b.p{background:var(--inv);color:var(--ivt);border-color:var(--inv)}
.b.sq{width:32px;padding:0;justify-content:center}
select.b{padding:0 8px;appearance:none;-webkit-appearance:none}
.seg{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.seg button{width:32px;height:30px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--mut)}
.seg button.on{background:var(--inv);color:var(--ivt)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 22px 0;overflow:hidden}.body>:not(#list){flex:none}#list{flex:1;min-height:0;overflow:auto;padding-bottom:16px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;color:var(--mut);font-size:12px}
.crumb{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border-radius:5px;cursor:pointer}
.crumb:hover,.crumb.over{background:var(--s2);color:var(--tx)}
.crumbs svg.lucide{width:12px;height:12px}
h2{font-size:30px;font-weight:650;letter-spacing:-.04em;line-height:1.1;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{margin-top:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 108px 62px;align-items:center;gap:10px;padding:0 6px;height:38px;border-bottom:1px solid var(--bd);cursor:pointer;position:relative}
.row.h{position:sticky;top:0;z-index:2;background:var(--bg);height:30px;cursor:default;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.row:not(.h):hover{background:var(--s1)}
.row.over,.card.over{background:var(--s2);outline:1px solid var(--tx);outline-offset:-1px}
.cn{display:flex;align-items:center;gap:10px;min-width:0}
.ico{width:24px;height:24px;border-radius:6px;border:1px solid var(--bd);display:grid;place-items:center;flex:none;background:var(--bg)}
.ico svg.lucide{width:13px;height:13px}
.nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mut);font-size:12px;white-space:nowrap}
.ac{display:flex;gap:2px;justify-content:flex-end;opacity:0}
.row:hover .ac,.card:hover .ac,.ac:focus-within{opacity:1}
@media(hover:none){.ac{opacity:1}}
.ib{width:26px;height:26px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.ib:hover{background:var(--inv);color:var(--ivt)}
.cards{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.card{border:1px solid var(--bd);border-radius:9px;padding:6px 6px 8px;cursor:pointer;position:relative;display:grid;gap:6px;min-width:0}
.card:hover{border-color:var(--tx)}
.th{aspect-ratio:1.25;border-radius:6px;background:var(--s2);display:grid;place-items:center;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th svg.lucide{width:26px;height:26px;stroke-width:1.25}
.card .in{padding:0 3px;min-width:0}
.card .ac{position:absolute;top:10px;right:10px;background:var(--bg);border-radius:6px;border:1px solid var(--bd)}
.empty{padding:56px 10px;text-align:center;color:var(--mut);display:grid;gap:8px;justify-items:center}
.empty svg.lucide{width:26px;height:26px;stroke-width:1.25}
.drop{position:fixed;inset:10px;border:1.5px dashed var(--tx);border-radius:14px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:none;place-content:center;text-align:center;z-index:80;pointer-events:none;gap:4px}
.drop.on{display:grid}.drop b{font-size:26px;letter-spacing:-.03em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:none;place-items:center;z-index:90;padding:16px}
.modal.on{display:grid}
.box{background:var(--bg);border:1px solid var(--bd2);border-radius:12px;padding:16px;width:min(420px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.box.wide{width:min(900px,100%)}
.box input{width:100%;height:34px;border:1px solid var(--bd2);border-radius:7px;padding:0 10px;background:var(--bg);outline:0}
.box input:focus{border-color:var(--tx)}
.hd{display:flex;align-items:center;gap:8px}.hd b{font-size:15px;letter-spacing:-.02em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{display:grid;place-items:center;min-height:100px}
.pv img,.pv video{max-width:100%;max-height:60vh;border-radius:8px}
.pv iframe{width:100%;height:60vh;border:0}
pre{margin:0;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;background:var(--s1);border:1px solid var(--bd);padding:12px;border-radius:8px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;width:100%}
@media(max-height:720px) and (min-width:821px){.cw{width:88px;height:88px}.lg{display:none}.big{font-size:28px}.side{gap:10px}}
@media(max-width:820px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.side{overflow:visible;border-right:0;border-bottom:1px solid var(--bd);display:grid;grid-template-columns:84px 1fr;grid-template-areas:"brand brand" "chart hero" "nav nav";gap:8px 12px;padding:10px 14px}.cw{width:76px;height:76px}.cc b{font-size:16px}.cc span{display:none}.q,#qtext,.lg,.side>div:nth-child(5)>.lbl{display:none}.big{font-size:26px}.hero{grid-area:hero;align-content:center}.side>div:nth-child(3){grid-area:chart}.side>div:nth-child(5){grid-area:nav}.brand{grid-area:brand}
.side .brand,.side .nav{grid-column:1/-1}
.nav{display:flex;flex-wrap:wrap;gap:4px}.nv{border:1px solid var(--bd);padding:4px 8px;gap:6px}.nv em{display:none}
.top,.body{padding-left:14px;padding-right:14px}
.row{grid-template-columns:minmax(0,1fr) 70px 54px}
.row>.c-type,.row>.c-date{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><i data-lucide="hard-drive"></i></div><div><b>mono</b><span>files</span></div></div>
    <div class="hero"><div class="lbl">Storage used</div><div class="big" id="total">0</div><div class="sub" id="count"></div></div>
    <div>
      <div class="cw"><canvas id="chart"></canvas><div class="cc"><b id="cn">0</b><span>files</span></div></div>
      <div class="q" style="margin:10px 0 4px"><div id="qbar" style="width:0"></div></div>
      <div class="sub" id="qtext" style="font-size:11px"></div>
    </div>
    <div class="lg" id="legend"></div>
    <div><div class="lbl" style="margin-bottom:6px">Library</div><div class="nav" id="nav"></div></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="sr"><i data-lucide="search"></i><input id="search" placeholder="Search everything…" autocomplete="off"><kbd>/</kbd></div>
      <select class="b" id="sort"><option value="name">Name</option><option value="size">Size</option><option value="date">Date</option></select>
      <div class="seg"><button id="vList" title="List"><i data-lucide="list"></i></button><button id="vGrid" title="Grid"><i data-lucide="layout-grid"></i></button></div>
      <button class="b sq" id="theme" title="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="b" id="newFolder"><i data-lucide="folder-plus"></i>Folder</button>
      <button class="b p" id="uploadBtn"><i data-lucide="upload"></i>Upload</button>
      <input type="file" id="picker" multiple hidden>
    </div>
    <div class="body">
      <div class="crumbs" id="crumbs"></div>
      <h2 id="title"></h2><div class="sub" id="sub"></div>
      <div id="list"></div>
    </div>
  </main>
</div>
<div class="drop" id="drop"><b>Drop to upload</b><span class="sub">Files land in the current folder</span></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
const CATS={image:['Images','image'],video:['Video','film'],audio:['Audio','music'],doc:['Documents','file-text'],other:['Other','archive']};
const GL=['#0a0a0a','#3d3d3d','#6e6e6e','#a2a2a2','#d4d4d4'],GD=['#ffffff','#c9c9c9','#949494','#606060','#363636'];
const DOCX=/\.(pdf|txt|md|csv|json|docx?|xlsx?|pptx?|html?|css|js|ts|xml|log|rtf)$/i;
let items=[],cwd=null,q='',filter='all',view='list',sort='name',db,chart;
const urls={},$=s=>document.querySelector(s);
const icons=()=>{try{lucide.createIcons()}catch(_){}};
const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};

/* storage */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('file-manager',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const tx=(m,f)=>new Promise((res,rej)=>{const t=db.transaction('items',m),s=t.objectStore('items'),r=f(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)});
const put=it=>tx('readwrite',s=>s.put(it)),del=id=>tx('readwrite',s=>s.delete(id)),loadAll=()=>tx('readonly',s=>s.getAll());

/* helpers */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(b,parts){if(b<1024)return parts?[b,'B']:b+' B';const u=['KB','MB','GB'];let i=-1;do{b/=1024;i++}while(b>=1024&&i<2);const n=b.toFixed(b<10?1:0);return parts?[n,u[i]]:n+' '+u[i]}
function cat(it){const m=it.mime||'';if(m.startsWith('image/'))return'image';if(m.startsWith('video/'))return'video';if(m.startsWith('audio/'))return'audio';if(m.startsWith('text/')||DOCX.test(it.name))return'doc';return'other'}
const byId=id=>items.find(i=>i.id===id),kids=id=>items.filter(i=>i.parent===id);
function path(id){const p=[];while(id){const it=byId(id);if(!it)break;p.unshift(it);id=it.parent}return p}
function isInside(id,t){while(t){if(t===id)return true;t=byId(t)?.parent}return false}
const url=it=>urls[it.id]||(urls[it.id]=URL.createObjectURL(it.blob));
function uniq(name,parent,skip){const s=kids(parent).filter(i=>i.id!==skip).map(i=>i.name);if(!s.includes(name))return name;const d=name.lastIndexOf('.'),b=d>0?name.slice(0,d):name,e=d>0?name.slice(d):'';let n=2;while(s.includes(`${b} (${n})${e}`))n++;return`${b} (${n})${e}`}
function kind(it){if(it.type==='folder')return'Folder';const d=it.name.lastIndexOf('.');return d>0&&it.name.length-d<=6?it.name.slice(d+1).toUpperCase():CATS[cat(it)][0]}
const icon=it=>it.type==='folder'?'folder':CATS[cat(it)][1];
const dt=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});

/* dialogs */
function dialog(html,wide){return new Promise(res=>{const m=$('#modal'),b=$('#box');b.className='box'+(wide?' wide':'');b.innerHTML=html;icons();m.classList.add('on');
 const close=v=>{m.classList.remove('on');b.innerHTML='';m.onclick=null;res(v)};m.onclick=e=>{if(e.target===m)close(null)};
 const inp=b.querySelector('input');b.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>close(x.dataset.r==='ok'?(inp?inp.value:true):null));
 if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')close(inp.value);if(e.key==='Escape')close(null)}}})}
const foot=ok=>`<div style="display:flex;gap:8px;justify-content:flex-end"><button class="b" data-r="no">Cancel</button><button class="b p" data-r="ok">${ok}</button></div>`;
const ask=(t,v)=>dialog(`<div class="hd"><b>${t}</b></div><input type="text" value="${esc(v||'')}">${foot('Save')}`);
const sure=m=>dialog(`<div class="hd"><b>${m}</b></div><div class="sub">This can’t be undone.</div>${foot('Delete')}`);

/* actions */
async function addFiles(fs,parent){for(const f of fs){const it={id:uid(),name:uniq(f.name,parent),type:'file',parent,size:f.size,mime:f.type,created:Date.now(),blob:f};items.push(it);await put(it)}render()}
async function newFolder(){const n=(await ask('New folder','Untitled'))?.trim();if(!n)return;const it={id:uid(),name:uniq(n,cwd),type:'folder',parent:cwd,size:0,created:Date.now()};items.push(it);await put(it);render()}
async function rename(it){const n=(await ask('Rename',it.name))?.trim();if(!n||n===it.name)return;it.name=uniq(n,it.parent,it.id);await put(it);render()}
async function remove(it){if(!await sure(`Delete “${esc(it.name)}”${it.type==='folder'?' and its contents':''}?`))return;
 const dead=[];(function w(i){dead.push(i);kids(i.id).forEach(w)})(it);
 for(const d of dead){await del(d.id);if(urls[d.id]){URL.revokeObjectURL(urls[d.id]);delete urls[d.id]}}
 items=items.filter(i=>!dead.includes(i));if(!byId(cwd))cwd=null;render()}
async function move(id,t){const it=byId(id);if(!it||it.parent===t||isInside(id,t))return;it.parent=t;it.name=uniq(it.name,t,it.id);await put(it);render()}
async function preview(it){const u=url(it),c=cat(it);let b;
 if(c==='image')b=`<img src="${u}" alt="">`;else if(c==='video')b=`<video src="${u}" controls></video>`;else if(c==='audio')b=`<audio src="${u}" controls></audio>`;
 else if(it.mime==='application/pdf')b=`<iframe src="${u}"></iframe>`;
 else if(c==='doc'&&it.size<500000)b=`<pre>${esc((await it.blob.text()).slice(0,100000))}</pre>`;
 else b='<div class="sub">No preview for this file type.</div>';
 await dialog(`<div class="hd"><div class="ico"><i data-lucide="${icon(it)}"></i></div><b>${esc(it.name)}</b><button class="ib" data-r="no"><i data-lucide="x"></i></button></div>
 <div class="sub">${kind(it)} · ${fmt(it.size)} · ${dt(it.created)}</div><div class="pv">${b}</div>`,true)}

/* render */
function visible(){let l=q?items.filter(i=>i.name.toLowerCase().includes(q.toLowerCase())):kids(cwd);
 if(filter!=='all')l=l.filter(i=>i.type==='file'&&cat(i)===filter);
 const s={name:(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}),size:(a,b)=>b.size-a.size,date:(a,b)=>b.created-a.created}[sort];
 return l.sort((a,b)=>(a.type==='folder'?0:1)-(b.type==='folder'?0:1)||s(a,b))}
const acts=`<div class="ac"><button class="ib" data-a="ren" title="Rename"><i data-lucide="pencil"></i></button><button class="ib" data-a="del" title="Delete"><i data-lucide="trash-2"></i></button></div>`;

function render(){
 const files=items.filter(i=>i.type==='file'),cur=byId(cwd),list=visible();
 $('#nav').innerHTML=[['all','All files','layers',files.length],...Object.entries(CATS).map(([k,v])=>[k,v[0],v[1],files.filter(f=>cat(f)===k).length])]
  .map(([k,l,ic,n])=>`<button class="nv ${filter===k?'on':''}" data-f="${k}"><i data-lucide="${ic}"></i><span>${l}</span><em>${n}</em></button>`).join('');
 $('#nav').querySelectorAll('.nv').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
 const cr=[{id:null,name:'Home'},...path(cwd)];
 $('#crumbs').innerHTML=cr.map((c,i)=>`<span class="crumb" data-id="${c.id||''}">${i?'':'<i data-lucide="home"></i>'}${esc(c.name)}</span>${i<cr.length-1?'<i data-lucide="chevron-right"></i>':''}`).join('');
 $('#crumbs').querySelectorAll('.crumb').forEach(el=>{const id=el.dataset.id||null;el.onclick=()=>{cwd=id;q='';$('#search').value='';render()};
  el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>drop(e,id,el)});
 $('#title').textContent=q?`“${q}”`:cur?cur.name:'Home';
 $('#sub').textContent=`${list.length} ${list.length===1?'item':'items'}${filter!=='all'?' · '+CATS[filter][0]:''}${q?' · search':''}`;
 $('#vList').classList.toggle('on',view==='list');$('#vGrid').classList.toggle('on',view==='grid');
 const where=it=>q?(path(it.parent).map(p=>p.name).join(' / ')||'Home'):'';
 let h;
 if(!list.length)h=`<div class="empty"><i data-lucide="${q?'search-x':'folder-open'}"></i><b>${q||filter!=='all'?'Nothing matches':'This folder is empty'}</b><span class="sub">${q||filter!=='all'?'Try another search or filter.':'Drag files here or press Upload.'}</span></div>`;
 else if(view==='list')h=`<div class="tbl"><div class="row h"><div>Name</div><div class="c-type">Type</div><div>Size</div><div class="c-date">Modified</div><div></div></div>`+list.map(it=>`<div class="row item" draggable="true" data-id="${it.id}">
  <div class="cn"><div class="ico"><i data-lucide="${icon(it)}"></i></div><span class="nm">${esc(it.name)}</span><span class="pa">${esc(where(it))}</span></div>
  <div class="mu c-type">${kind(it)}</div><div class="mu">${it.type==='folder'?kids(it.id).length+' items':fmt(it.size)}</div><div class="mu c-date">${dt(it.created)}</div>${acts}</div>`).join('')+'</div>';
 else h=`<div class="cards">`+list.map(it=>`<div class="card item" draggable="true" data-id="${it.id}"><div class="th">${it.type==='file'&&cat(it)==='image'?`<img src="${url(it)}" alt="" loading="lazy">`:`<i data-lucide="${icon(it)}"></i>`}</div>
  <div class="in"><div class="nm">${esc(it.name)}</div><div class="mu">${it.type==='folder'?kids(it.id).length+' items':fmt(it.size)}${where(it)?' · '+esc(where(it)):''}</div></div>${acts}</div>`).join('')+'</div>';
 $('#list').innerHTML=h;
 $('#list').querySelectorAll('.item').forEach(el=>{const it=byId(el.dataset.id);
  el.onclick=e=>{const a=e.target.closest('[data-a]');if(a){e.stopPropagation();a.dataset.a==='ren'?rename(it):remove(it);return}
   if(it.type==='folder'){cwd=it.id;q='';$('#search').value='';render()}else preview(it)};
  el.ondragstart=e=>{e.dataTransfer.setData('text/fm-id',it.id);e.dataTransfer.effectAllowed='move'};
  if(it.type==='folder'){el.ondragover=e=>{e.preventDefault();e.stopPropagation();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>drop(e,it.id,el)}});
 stats(files);icons();
}
function drop(e,t,el){e.preventDefault();e.stopPropagation();el.classList.remove('over');$('#drop').classList.remove('on');
 const id=e.dataTransfer.getData('text/fm-id');if(id)move(id,t);else if(e.dataTransfer.files.length)addFiles([...e.dataTransfer.files],t)}

/* chart (Chart.js) */
function stats(files){
 const total=files.reduce((s,i)=>s+i.size,0),keys=Object.keys(CATS),by={};keys.forEach(k=>by[k]={n:0,s:0});files.forEach(i=>{const c=cat(i);by[c].n++;by[c].s+=i.size});
 const [n,u]=fmt(total,true),pal=dark()?GD:GL;
 $('#total').innerHTML=`${n}<small>${u}</small>`;$('#cn').textContent=files.length;
 $('#count').textContent=`${items.length-files.length} folders · ${files.length} files`;
 $('#legend').innerHTML=keys.map((k,i)=>`<div class="lr"><i style="background:${pal[i]};${dark()?'':'border:1px solid var(--bd)'}"></i><span>${CATS[k][0]}</span><em>${fmt(by[k].s)}</em></div>`).join('');
 const data=total?keys.map(k=>by[k].s):[1],bg=total?pal:[dark()?'#1c1c1c':'#eee'];
 try{const bd=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if(!chart)chart=new Chart($('#chart'),{type:'doughnut',data:{labels:keys.map(k=>CATS[k][0]),datasets:[{data,backgroundColor:bg,borderColor:bd,borderWidth:2}]},options:{cutout:'74%',maintainAspectRatio:false,animation:{duration:500},plugins:{legend:{display:false},tooltip:{enabled:!!total,callbacks:{label:c=>' '+fmt(c.parsed)}}}}});
  else{const d=chart.data.datasets[0];d.data=data;d.backgroundColor=bg;d.borderColor=bd;chart.options.plugins.tooltip.enabled=!!total;chart.update()}}catch(_){}
 try{navigator.storage.estimate().then(e=>{if(!e.quota)return;$('#qbar').style.width=Math.max(1,e.usage/e.quota*100)+'%';$('#qtext').textContent=`${fmt(e.usage)} of ${fmt(e.quota)} browser quota`})}catch(_){}
}

/* wiring */
$('#newFolder').onclick=newFolder;$('#uploadBtn').onclick=()=>$('#picker').click();
$('#picker').onchange=e=>{addFiles([...e.target.files],cwd);e.target.value=''};
$('#search').oninput=e=>{q=e.target.value.trim();render()};
$('#sort').onchange=e=>{sort=e.target.value;render()};
$('#vList').onclick=()=>{view='list';render()};$('#vGrid').onclick=()=>{view='grid';render()};
$('#theme').onclick=()=>{document.documentElement.dataset.theme=dark()?'light':'dark';setTheme();render()};
function setTheme(){$('#theme').innerHTML=`<i data-lucide="${dark()?'sun':'moon'}"></i>`;icons()}
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#search').focus()}
 else if(e.key==='Escape'&&document.activeElement===$('#search')){$('#search').value='';q='';$('#search').blur();render()}});
let dc=0;const hasF=e=>[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(hasF(e)){dc++;$('#drop').classList.add('on')}});
addEventListener('dragleave',e=>{if(hasF(e)){dc=Math.max(0,dc-1);if(!dc)$('#drop').classList.remove('on')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').classList.remove('on');if(e.dataTransfer.files.length)addFiles([...e.dataTransfer.files],cwd)});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{setTheme();render()});
(async()=>{try{db=await openDB();items=await loadAll()||[]}catch(e){items=[];db={transaction(){throw e}}}setTheme();render()})();
</script>
</body>
</html>
