<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folder Structure Maker</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>Folder Structure Maker</h1>
<p class="lead">Design your project folders and files. Files come with starter code. Copy one script and your whole project appears.</p>
<div class="panel"><div id="tree"></div>
<div class="bar"><button id="ex">Example site</button><button id="ex2">Example Python app</button><button id="rs">Reset</button></div></div>
<h2>Preview</h2><pre id="o1"></pre>
<h2>Mac, Linux, Git Bash</h2><p class="note">Open a terminal in the folder where you want the project, paste, press Enter.</p><pre id="o2"></pre><button class="p" data-c="o2">Copy script</button>
<h2>Windows PowerShell</h2><p class="note">Same idea, in PowerShell.</p><pre id="o3"></pre><button class="p" data-c="o3">Copy script</button>
</main>
<script src="js/script.js"></script>
</body>
</html>
