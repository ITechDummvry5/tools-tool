<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report Test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#111;--mut:#777;--bd:#e4e4e4;--in:#f7f7f7;--s1:12px;--s2:14px;--s3:20px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--tx:#ececec;--mut:#8a8a8a;--bd:#262626;--in:#131313;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0b;--tx:#ececec;--mut:#8a8a8a;--bd:#262626;--in:#131313;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 var(--s2)/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.dock{border-top:1px solid var(--bd);padding:10px 20px}
.msg{display:flex;gap:8px;align-items:center;font-size:var(--s1);color:var(--mut);margin-bottom:8px}
.bot{border:1px solid var(--bd);border-radius:4px;padding:2px 6px;color:var(--tx);font-weight:500;flex:none}
.cmp{display:flex;gap:6px;align-items:flex-end;border:1px solid var(--bd);border-radius:10px;padding:6px;background:var(--in)}
.cmp:focus-within{border-color:var(--tx)}
.cmp textarea{flex:1;border:0;background:transparent;resize:none;height:36px;min-height:36px;max-height:120px;padding:8px 10px}
.cmp textarea:focus{outline:none}
.cmp button{padding:11px 12px}
button{height:34px;padding:0 12px}
select{height:34px}
.lk input,.add input{height:34px}
.lk{display:flex;gap:40px;align-items:center;margin-bottom:6px}
.la,.lc{display:flex;gap:6px;align-items:center;flex:1 1 0;min-width:0}
@media(max-width:820px){.lk{flex-direction:column;align-items:stretch;gap:6px}.la,.lc{flex:none}.lk .tg{width:52px}.lk input[data-p="u"],.lk input[data-p="n"]{flex:1 1 0}}
.lk:last-child{margin-bottom:0}
.lk button{padding:0 12px;flex:none}
.lk button[data-act="open"]{width:56px;padding:0}
.lk button[data-act="rmlink"]{width:34px;padding:0}
.lk .tg{width:52px;flex:none}
.lk input[data-p="u"]{flex:2;min-width:0}
.lk input[data-p="n"]{flex:1;min-width:0}
.pn .lb button{height:26px;padding:0 8px}
.pn .msgbox{min-height:56px;height:56px;flex:none}
.pn textarea{min-height:220px}
.addimg{height:34px;display:inline-flex;align-items:center;padding:0 12px}
.imgs{min-height:56px}
.ilist{flex:1;min-height:220px;border:1px solid var(--bd);border-radius:6px;background:var(--in);padding:8px 10px;overflow:auto}
.ilist .none{margin:0}
.ilist ol.notes{margin:0}
.pf{height:44px;padding-top:10px;display:flex;align-items:center;font-size:var(--s1);color:var(--mut)}
.dock{padding:10px 20px}
.chat{display:flex;flex-direction:column;gap:6px;max-height:110px;overflow:auto;margin-bottom:8px}
.bub{max-width:min(560px,85%);padding:7px 10px;border-radius:12px;font-size:var(--s1);line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub.b{align-self:flex-start;background:var(--in);border:1px solid var(--bd);border-bottom-left-radius:4px}
.bub.b::before{content:"Bot";display:block;font-weight:600}
.bub.u{align-self:flex-end;background:var(--tx);color:var(--bg);border-bottom-right-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{height:28px;border-radius:14px;padding:0 12px}
.cmp{align-items:flex-end;flex-wrap:nowrap}
.cmp textarea{flex:1;min-width:0}
.cmp button{padding:0 16px;height:36px}
footer.dock{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:0;border:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:40}
.panel{display:none;width:min(380px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px}
.dock.open .panel{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.ph button{border:0;height:26px;width:26px;padding:0;color:var(--mut)}
footer.dock .chat{min-height:120px;max-height:240px}
.fab{width:52px;height:52px;border-radius:50%;padding:0;background:var(--tx);color:var(--bg);border:0;display:grid;place-items:center;cursor:pointer}
@media(max-width:820px){.dock{padding:8px 14px}.chat{max-height:72px}}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--bd)}
h1{font-size:var(--s3);font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.2}
.sub{font-size:var(--s1);color:var(--mut)}
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.tabs button{border:0;border-radius:0}
.tabs button.on{background:var(--tx);color:var(--bg)}
button{font:500 var(--s1)/1 Inter,system-ui,sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:9px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--tx)}
button.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
label.chk{font-size:var(--s1);color:var(--mut);display:flex;gap:6px;align-items:center}
label.chk input{width:auto;margin:0}
label.chk input.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;padding:0;border:0;border-radius:12px;background:var(--bd);position:relative;cursor:pointer;transition:background .2s;flex:none}
label.chk input.sw::before{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
label.chk input.sw:checked{background:#c2570c}
label.chk input.sw:checked::before{transform:translateX(16px)}
label.chk input.sw:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.body{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--bd);overflow:auto;padding:8px}
main{overflow:auto;padding:20px;min-height:0}
.si{padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.si:hover{background:var(--in)}
.si.on{background:var(--in);border-color:var(--bd)}
.si.fixed .st{text-decoration:line-through;color:var(--mut)}
.st{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{font-size:var(--s1);color:var(--mut)}
.none{font-size:var(--s1);color:var(--mut);margin:0 0 8px}
aside .none{padding:10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,.imgs:focus{outline:1px solid var(--tx);outline-offset:-1px}
.eh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.title{flex:1 1 260px;font-size:var(--s3);font-weight:600;background:transparent;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:6px 0;letter-spacing:-.01em}
.ea{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ea select{width:auto;padding:8px 10px;font-size:var(--s1);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pn{border:1px solid var(--bd);border-radius:8px;padding:12px;display:flex;flex-direction:column;min-width:0}
.pn.wide{grid-column:1/-1}
.lb{font-size:var(--s1);color:var(--mut);margin-bottom:8px;display:flex;gap:8px;justify-content:space-between}
.lb span:first-child{color:var(--tx);font-weight:500}
.pn textarea{flex:1;min-height:300px;resize:vertical;display:block}
ol.notes{margin:0 0 10px;padding-left:20px}
ol.notes li{margin:4px 0}
ol.notes li span{cursor:pointer;color:var(--mut);margin-left:8px;font-size:var(--s1)}
ol.notes li span:hover{color:var(--tx)}
.add{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.lks{margin-bottom:16px}
.lks .lb button{padding:5px 8px}
.msgbox{min-height:52px;height:52px;resize:vertical;display:block}
.lk{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lk .tg{font-size:var(--s1);font-weight:500;color:var(--mut);width:44px;flex:none}
.lk input[data-p="u"]{flex:2;min-width:0}
.lk input[data-p="n"]{flex:1;min-width:0}
@media(max-width:820px){.lk{flex-wrap:wrap}.lk .tg{width:100%}.lk input[data-p="u"],.lk input[data-p="n"]{flex:1 1 100%}}

.imgs{display:flex;flex-wrap:wrap;gap:10px;padding:10px;border:1px dashed var(--bd);border-radius:6px;min-height:64px;align-items:center;outline:none}
.th{position:relative}
.th img{height:96px;border-radius:4px;border:1px solid var(--bd);cursor:zoom-in;display:block}
.th span{position:absolute;top:-6px;right:-6px;background:var(--tx);color:var(--bg);width:18px;height:18px;border-radius:50%;font-size:var(--s1);line-height:1;display:grid;place-items:center;cursor:pointer}
.th b{position:absolute;bottom:4px;left:4px;background:var(--tx);color:var(--bg);font-size:var(--s1);font-weight:500;padding:2px 6px;border-radius:4px;cursor:pointer}
.addimg{border:1px solid var(--bd);border-radius:6px;padding:9px 12px;cursor:pointer;font-size:var(--s1);font-weight:500}
.addimg:hover{border-color:var(--tx)}
.empty{max-width:420px;margin:60px auto;text-align:center;color:var(--mut)}
.empty button{margin-top:12px}
.rv{display:flex;flex-direction:column;height:100%}
.rv .ttl{font-weight:600}
#out{flex:1;min-height:200px;white-space:pre;resize:none;font-size:var(--s1)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:50;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:94vw;max-height:90vh}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:var(--s1);opacity:0;transition:opacity .15s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:820px){
.body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
aside{border-right:0;border-bottom:1px solid var(--bd);max-height:26vh}
main{padding:14px}
.grid{grid-template-columns:1fr}
.pn textarea{min-height:200px}
.bar{padding:10px 14px}
}
</style>
</head>
<body>
<div class="app">
<header class="bar">
<div><h1>Report Test</h1><div class="sub" id="meta"></div></div>
<div class="tabs"><button data-tab="c" class="on">Containers</button><button data-tab="r">Report</button></div>
<div class="right">
<label class="chk"><span>Include pasted content</span><input type="checkbox" id="inc" class="sw" checked></label>
<button class="p" id="add">+ Container</button>
</div>
</header>
<div class="body">
<aside id="side"></aside>
<main id="main"></main>
</div>
<footer class="dock" id="dock">
<div class="panel" id="panel">
<div class="ph"><span>Bot</span><button data-dock="close" aria-label="Close">✕</button></div>
<div class="chat" id="chat"></div>
<div class="chips"><button data-dock="sample">Sample</button><button data-dock="import">Import</button><button data-dock="file">Open file</button><button data-dock="copyjson">Copy JSON</button><button data-dock="export">Export</button><button data-dock="pdf">PDF</button><button data-dock="help">Help</button></div>
<div class="cmp">
<textarea id="jin" placeholder="Message the bot, or paste JSON…" spellcheck="false"></textarea>
<button class="p" data-dock="send">Send</button>
</div>
</div>
<input type="file" id="jfile" accept=".json,application/json" hidden>
<button class="fab" id="fab" data-dock="toggle" aria-label="Chat bot"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="4" r="1"/><path d="M9 13v1M15 13v1M9.5 16.5h5"/></svg></button>
</footer>
</div>
<div id="lb"><img alt=""></div>
<div class="toast" id="toast">Copied</div>
<script>
const KEY='report-test-v1';
let S={items:[],inc:true,sel:null},tab='c';
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.items.forEach(x=>{x.images=x.images||[];x.links=(x.links||(x.link?[x.link]:[])).map(l=>typeof l==='string'?{u:l,n:''}:l);while(x.links.length<2)x.links.push({u:'',n:''});delete x.link});
const SEV=['Low','Medium','High','Critical'];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const cur=()=>S.items.find(x=>x.id===S.sel);
if(!cur()&&S.items.length)S.sel=S.items[0].id;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full: images won’t persist')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1300)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const plural=(n,w)=>n+' '+w+(n==1?'':'s');
const cnt=s=>s.length?plural(s.split('\n').length,'line')+' · '+plural(s.length,'character'):'Nothing pasted yet';

function one(it,i){
  let o='## '+(i+1)+'. '+(it.title||'Untitled')+'  ['+SEV[it.sev]+' · '+(it.fixed?'Fixed':'Open')+']\n';
  const L=it.links.map((x,k)=>({u:x.u.trim(),n:x.n.trim(),k})).filter(x=>x.u||x.n);if(L.length)o+='\nPath:\n'+L.map((x,j)=>(j+1)+'. '+(x.k==0?'Start':(x.k==it.links.length-1?'Error':'Step'))+': '+[x.u,x.n].filter(Boolean).join(' — ')).join('\n')+'\n';
  if((it.message||'').trim())o+='\nMessage shown:\n> '+it.message.trim().split('\n').join('\n> ')+'\n';
  if(S.inc&&it.content.trim())o+='\nPasted:\n```\n'+it.content.trim()+'\n```\n';
  if(it.images.length)o+='\nImages: '+it.images.length+' attached (see PDF/HTML export)\n';
  o+='\nWhat’s wrong:\n';
  o+=it.notes.length?it.notes.map((n,k)=>(k+1)+'. '+n).join('\n'):'- (no notes)';
  return o+'\n';
}
function full(){
  const n=S.items.length,open=S.items.filter(x=>!x.fixed).length;
  if(!n)return '';
  return '# Report\nContainers: '+n+' · Open: '+open+' · Fixed: '+(n-open)+'\n\n'+S.items.map(one).join('\n');
}
function meta(){
  const n=S.items.length,open=S.items.filter(x=>!x.fixed).length;
  $('#meta').textContent=n?plural(n,'container')+' · '+open+' open · '+(n-open)+' fixed':'Paste it, note what’s wrong, export the list.';
}
function side(){
  $('#side').innerHTML=S.items.length?S.items.map((it,i)=>`<div class="si ${it.id===S.sel&&tab==='c'?'on':''} ${it.fixed?'fixed':''}" data-sel="${it.id}"><div class="st">${String(i+1).padStart(2,'0')} · ${esc(it.title||'Untitled')}</div><div class="sm">${SEV[it.sev]} · ${it.fixed?'Fixed':'Open'} · ${plural(it.notes.length,'issue')}${it.images.length?' · '+plural(it.images.length,'image'):''}</div></div>`).join(''):'<div class="none">No containers yet.</div>';
}
function upd(){meta();side();save()}

function render(focus){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  side();meta();save();
  const M=$('#main');
  if(tab==='r'){
    M.innerHTML=`<div class="rv"><div class="eh"><div><div class="ttl">Full report</div><div class="sub">All containers combined. Updates as you type.</div></div>
    <div class="ea"><button data-act="clear">Clear all</button><button data-act="dlmd">Download .md</button><button data-act="dlhtml">Download .html</button><button data-act="pdf">Download PDF</button><button class="p" data-act="copyall">Copy report</button></div></div>
    <textarea id="out" readonly placeholder="Nothing to report yet."></textarea></div>`;
    $('#out').value=full();return;
  }
  const it=cur();
  if(!it){M.innerHTML='<div class="empty">Nothing here yet.<br>Add a container, paste what you’re testing, then list what’s wrong.<br><button class="p" data-act="new">+ Container</button></div>';return}
  const i=S.items.indexOf(it);
  M.innerHTML=`<div class="ed">
  <div class="eh">
    <input class="title" data-f="title" placeholder="Untitled container" value="${esc(it.title)}">
    <div class="ea">
      <select data-f="sev">${SEV.map((s,k)=>`<option value="${k}" ${k==it.sev?'selected':''}>${s}</option>`).join('')}</select>
      <select data-f="fixed"><option value="0" ${!it.fixed?'selected':''}>Open</option><option value="1" ${it.fixed?'selected':''}>Fixed</option></select>
      <button data-act="copy">Copy list</button>
      <button data-act="dl">Download .md</button>
      <button data-act="rm">Delete</button>
    </div>
  </div>
  <div class="grid">
  <section class="pn wide"><div class="lb"><span>Path · optional</span><button data-act="addlink">+ Step</button></div>${it.links.map((l,k)=>`<div class="lk"><div class="la"><span class="tg">${k==0?'Start':(k==it.links.length-1?'Error':'Step '+(k+1))}</span><input data-link="${k}" data-p="u" type="url" placeholder="https://…" value="${esc(l.u)}"></div><div class="lc"><input data-link="${k}" data-p="n" placeholder="${k==0?'e.g. Open the home page':(k==it.links.length-1?'What goes wrong':'e.g. Click Login')}" value="${esc(l.n)}"><button data-act="open" data-k="${k}">Open</button><button data-act="rmlink" data-k="${k}" ${k==0||k==it.links.length-1?'style="visibility:hidden" tabindex="-1"':''}>✕</button></div></div>`).join('')}</section>
  <section class="pn wide"><div class="lb"><span>Message shown · optional</span><span>exact text of the error or notification</span></div><textarea class="msgbox" data-f="message" placeholder="e.g. Invalid email or password">${esc(it.message||'')}</textarea></section>
    <section class="pn">
      <div class="lb"><span>Pasted content</span><span>code, text, error, URL</span></div>
      <textarea data-f="content" placeholder="Paste here…">${esc(it.content)}</textarea>
      <div class="pf"><span data-count>${cnt(it.content)}</span></div>
    </section>
    <section class="pn">
      <div class="lb"><span>Issues · ${it.notes.length}</span><span>Enter to add</span></div>
      <div class="ilist">${it.notes.length?`<ol class="notes">${it.notes.map((n,k)=>`<li>${esc(n)}<span data-del="${k}" title="Remove">✕</span></li>`).join('')}</ol>`:'<p class="none">No issues noted yet.</p>'}</div>
      <div class="add"><input data-note placeholder="What’s wrong?"><button data-act="addnote">Add</button></div>
      
    </section>
    <section class="pn wide">
      <div class="lb"><span>Screenshots · ${it.images.length}</span><span>Ctrl+V · or drag in</span></div>
      <div class="imgs" tabindex="0">${it.images.map((m,k)=>`<div class="th"><img src="${m}" alt="image ${k+1}"><b data-copyimg="${k}">Copy</b><span data-delimg="${k}">✕</span></div>`).join('')}<label class="addimg">+ Image<input type="file" accept="image/*" multiple data-file hidden></label></div>
    </section>
  </div></div>`;
  if(focus==='note'){const n=M.querySelector('[data-note]');if(n)n.focus()}
  if(focus==='title'){const n=M.querySelector('.title');if(n)n.focus()}
}

async function copy(t){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  toast('Copied');
}
function download(name,t,ty){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty||'text/markdown'}));a.download=name;a.click();
}
function addNote(){
  const it=cur(),inp=$('[data-note]');if(!it||!inp)return;
  const v=inp.value.trim();if(!v)return;
  it.notes.push(v);render('note');
}
function newItem(){
  const it={id:uid(),title:'',links:[{u:'',n:''},{u:'',n:''}],message:'',sev:1,fixed:false,content:'',notes:[],images:[]};
  S.items.push(it);S.sel=it.id;tab='c';render('title');
}
function htmlReport(pdf){
  const b=S.items.map((it,i)=>`<h2>${i+1}. ${esc(it.title||'Untitled')} <small>[${SEV[it.sev]} · ${it.fixed?'Fixed':'Open'}]</small></h2>`+(it.links.some(x=>x.u.trim()||x.n.trim())?`<h4>Path</h4><ol>${it.links.map((x,k)=>({u:x.u,n:x.n,k})).filter(x=>x.u.trim()||x.n.trim()).map(x=>`<li><b>${x.k==0?'Start':(x.k==it.links.length-1?'Error':'Step')}</b> ${x.u.trim()?`<a href="${esc(x.u)}">${esc(x.u)}</a>`:''} ${esc(x.n)}</li>`).join('')}</ol>`:'')+((it.message||'').trim()?`<blockquote>${esc(it.message)}</blockquote>`:'')+(S.inc&&it.content.trim()?`<pre style="background:#f4f4f4;padding:10px;overflow:auto">${esc(it.content.trim())}</pre>`:'')+it.images.map(m=>pdf?`<img class="shot" src="${m}">`:`<img src="${m}" style="max-width:100%;border:1px solid #ddd;margin:6px 0;display:block">`).join('')+`<h4>What’s wrong</h4><ol>${it.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>`).join('<hr>');
  if(pdf)return '<!DOCTYPE html><meta charset="utf-8"><title>Report</title><style>@page{margin:14mm}body{font:13px/1.5 system-ui,sans-serif;color:#111;margin:0}h1{font-size:22px}h2{font-size:17px;margin:18px 0 6px;break-after:avoid}h4{margin:12px 0 4px}small{color:#777;font-weight:400}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}hr{border:0;border-top:1px solid #ddd;margin:18px 0}.shot{display:block;width:100%;height:320px;object-fit:contain;background:#f4f4f4;border:1px solid #ddd;margin:8px 0;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}</style><body><h1>Report</h1>'+b+'</body>';
  return '<!DOCTYPE html><meta charset="utf-8"><title>Report</title><body style="font:15px system-ui;max-width:800px;margin:20px auto;padding:0 12px"><h1>Report</h1>'+b+'</body>';
}

function exportPdf(){
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  f.srcdoc=htmlReport(true);
  f.onload=async()=>{
    const d=f.contentDocument;
    await Promise.all([...d.images].map(i=>i.decode().catch(()=>{})));
    f.contentWindow.focus();f.contentWindow.print();
    setTimeout(()=>f.remove(),60000);
  };
  document.body.appendChild(f);
}

$('#side').addEventListener('click',e=>{
  const s=e.target.closest('[data-sel]');if(!s)return;
  S.sel=s.dataset.sel;tab='c';render();
});
document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render();
});
$('#add').onclick=newItem;
$('#inc').checked=S.inc;
$('#inc').onchange=e=>{S.inc=e.target.checked;save();if(tab==='r')render()};

const M=$('#main');
M.addEventListener('input',e=>{
  const it=cur(),f=e.target.dataset.f;if(it&&e.target.dataset.link!==undefined){it.links[+e.target.dataset.link][e.target.dataset.p]=e.target.value;upd();return}if(!it||!f)return;
  if(f==='title'||f==='content'||f==='link'||f==='message'){it[f]=e.target.value;if(f==='content'){const c=M.querySelector('[data-count]');if(c)c.textContent=cnt(it.content)}upd()}
});
M.addEventListener('change',e=>{
  const it=cur(),f=e.target.dataset.f;
  if(it&&f==='sev'){it.sev=+e.target.value;render()}
  else if(it&&f==='fixed'){it.fixed=e.target.value==='1';render()}
  if(e.target.matches('[data-file]')&&it)addImgs(it,imgsOf(e.target.files));
});
M.addEventListener('keydown',e=>{
  if(e.target.matches('[data-note]')&&e.key==='Enter'){e.preventDefault();addNote()}
});
M.addEventListener('click',e=>{
  const t=e.target,it=cur(),a=t.dataset.act;
  if(a==='new')return newItem();
  if(a==='copyall')return copy(full());
  if(a==='dlmd')return S.items.length&&download('report.md',full());
  if(a==='dlhtml')return S.items.length&&download('report.html',htmlReport(),'text/html');
  if(a==='pdf')return S.items.length&&exportPdf();
  if(a==='clear'){if(S.items.length&&confirm('Clear everything?')){S.items=[];S.sel=null;render()}return}
  if(!it)return;
  const i=S.items.indexOf(it);
  if(a==='addnote')addNote();
  else if(a==='open'){const u=((it.links[+t.dataset.k]||{}).u||'').trim();if(u)window.open(/^https?:/i.test(u)?u:'https://'+u,'_blank','noopener')}
  else if(a==='addlink'){it.links.splice(it.links.length-1,0,{u:'',n:''});render()}
  else if(a==='rmlink'){const k=+t.dataset.k;if(k===0||k===it.links.length-1)return;it.links.splice(k,1);while(it.links.length<2)it.links.push({u:'',n:''});render()}
  else if(a==='copy')copy(one(it,i));
  else if(a==='dl')download((it.title||'report').replace(/\W+/g,'-').toLowerCase()+'.md',one(it,i));
  else if(a==='rm'){if(confirm('Delete this container?')){S.items.splice(i,1);S.sel=(S.items[i]||S.items[i-1]||{}).id||null;render()}}
  else if(t.dataset.del!==undefined){it.notes.splice(+t.dataset.del,1);render('note')}
  else if(t.dataset.delimg!==undefined){it.images.splice(+t.dataset.delimg,1);render()}
  else if(t.dataset.copyimg!==undefined)copyImg(it.images[+t.dataset.copyimg]);
  else if(t.tagName==='IMG')openLb(t.src);
});

function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(f)})}
async function addImgs(it,fs){for(const f of fs){const d=await shrink(f);if(d)it.images.push(d)}render()}
async function copyImg(src){try{const im=new Image();im.src=src;await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);const b=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Image copied')}catch(e){toast('Copy blocked by browser')}}
function openLb(s){const l=$('#lb');l.querySelector('img').src=s;l.classList.add('on')}
$('#lb').onclick=()=>$('#lb').classList.remove('on');
const imgsOf=fl=>[...(fl||[])].filter(f=>f.type.startsWith('image/'));
document.addEventListener('paste',e=>{const it=cur();if(!it||tab!=='c')return;const fs=imgsOf(e.clipboardData&&e.clipboardData.files);if(!fs.length)return;e.preventDefault();addImgs(it,fs)});
M.addEventListener('dragover',e=>{if(cur()&&tab==='c')e.preventDefault()});
M.addEventListener('drop',e=>{const it=cur();if(!it||tab!=='c')return;const fs=imgsOf(e.dataTransfer.files);if(!fs.length)return;e.preventDefault();addImgs(it,fs)});
const SAMPLE={items:[{title:'Login button does nothing',sev:'high',fixed:false,links:[{u:'https://example.com',n:'Open the home page'},{u:'https://example.com/login',n:'Click Login'},{u:'https://example.com/login',n:'Nothing happens, console shows a 500'}],message:'Something went wrong. Please try again.',content:'POST /api/login 500 (Internal Server Error)',notes:['Button stays disabled after click','Console shows a 500 from /api/login']},{title:'Footer overlaps on mobile',sev:'low',fixed:false,links:[{u:'https://example.com/contact',n:''}],content:'',notes:['Links overlap the copyright line under 400px']}]};
function norm(o){const sv=['low','medium','high','critical'];let sev=typeof o.sev==='number'?o.sev:sv.indexOf(String(o.sev||'').toLowerCase());if(sev<0||sev>3)sev=1;let links=(o.links||(o.link?[o.link]:[])).map(l=>typeof l==='string'?{u:l,n:''}:{u:String((l&&l.u)||''),n:String((l&&l.n)||'')});while(links.length<2)links.push({u:'',n:''});return{id:uid(),title:String(o.title||''),message:String(o.message||''),sev,fixed:!!o.fixed,content:String(o.content||''),notes:(o.notes||[]).map(String),images:(o.images||[]).filter(x=>typeof x==='string'),links}}
function say(m){bubble(m,'b')}
function grow(){const t=$('#jin');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}
$('#jin').addEventListener('input',grow);
function doImport(txt){try{const d=JSON.parse(txt);const a=Array.isArray(d)?d:d.items;if(!Array.isArray(a))throw new Error('expected an items list');const n=a.map(norm);S.items.push(...n);if(n.length)S.sel=n[0].id;tab='c';render();say('Imported '+plural(n.length,'container')+'.');$('#jin').value='';grow()}catch(e){say('Invalid JSON: '+e.message)}}
function exportData(){return JSON.stringify({app:'report-test',version:1,items:S.items},null,2)}
$('.dock').addEventListener('click',e=>{
  const a=e.target.dataset.dock;if(!a)return;
  if(a==='sample'){$('#jin').value=JSON.stringify(SAMPLE,null,2);grow();say('Sample is in the box below. Hit Import to add it.')}
  else if(a==='import'){const v=$('#jin').value.trim();if(!v)say('Paste JSON first, or hit Sample.');else doImport(v)}
  else if(a==='file')$('#jfile').click();
  else if(a==='copyjson'){if(!S.items.length)say('Nothing to copy yet.');else{copy(exportData());say('JSON copied.')}}
  else if(a==='pdf'){if(!S.items.length)say('Nothing to export yet.');else{exportPdf();say('PDF ready. Pick “Save as PDF” in the print window.')}}
  else if(a==='export'){if(!S.items.length)say('Nothing to export yet.');else{download('report-test.json',exportData(),'application/json');say('Exported '+plural(S.items.length,'container')+' to report-test.json.')}}
});
$('#jfile').onchange=async e=>{const f=e.target.files[0];if(f)doImport(await f.text());e.target.value=''};
function bubble(t,who){const c=$('#chat'),d=document.createElement('div');d.className='bub '+who;d.textContent=t;c.appendChild(d);while(c.children.length>30)c.firstChild.remove();c.scrollTop=c.scrollHeight}
function help(){say('Here’s what I can do:\n• sample: show example JSON\n• pdf: report with images, save as PDF\n• export: download report-test.json\n• copy json: copy everything\n• open file: import a .json file\n• clear: remove all containers\n• import: add the JSON from the box\n• or just paste JSON and hit Send')}
function send(){
  const ta=$('#jin'),v=ta.value.trim();
  if(!v){say('Type a command or paste JSON. Try help.');return}
  if(/^[\[{]/.test(v)){bubble('Pasted JSON · '+v.length+' characters','u');doImport(v);return}
  bubble(v,'u');ta.value='';grow();
  const w=v.toLowerCase().replace(/[^a-z ]/g,'').trim();
  const map={sample:'sample',example:'sample',export:'export',download:'export',pdf:'pdf',copy:'copyjson','copy json':'copyjson',file:'file','open file':'file',open:'file'};
  if(w==='help'||w==='')help();
  else if(w==='import')say('Paste your JSON in the box, then tap Import.');
  else if(w==='clear'){if(S.items.length&&confirm('Clear everything?')){S.items=[];S.sel=null;render();say('Cleared.')}else say('Nothing was cleared.')}
  else if(map[w]){window.__t=1;document.querySelector('[data-dock="'+map[w]+'"]').click();window.__t=0}
  else say('I don’t know that one. Type help.');
}
$('.dock').addEventListener('click',e=>{const bt=e.target.closest('[data-dock]');const a=bt&&bt.dataset.dock;if(!a||window.__t)return;
  if(a==='toggle'||a==='close'){e.stopPropagation();const d=$('#dock');d.classList.toggle('open',a==='toggle'?!d.classList.contains('open'):false);if(d.classList.contains('open'))$('#jin').focus();return}
  if(a==='send'){e.stopPropagation();send();return}
  if(a==='help'){e.stopPropagation();bubble('Help','u');help();return}
  bubble(e.target.textContent,'u')},true);
$('#jin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
say('Hi! Tap Sample to see the JSON format, paste it below, then hit Import. Type help for commands.');
render();
</script>
